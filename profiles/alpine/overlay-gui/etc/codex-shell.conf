# CoLinux Shell Configuration
# Mode: tty | gui
MODE=gui

# GUI compositor: cage | sway
COMPOSITOR=cage

# GUI terminal emulator
GUI_TERMINAL=foot

# Multi-monitor behavior for cage: mirror | last | extend
#   mirror  show the terminal on ALL connected displays (default)
#   last    use only the most recently connected display
#   extend  extend the display across all connected monitors
# (cage -m; ignored by the sway fallback compositor)
CAGE_MODE=mirror

# Whether to fallback to TTY if Wayland fails
GUI_FALLBACK_TTY=true

# Log file for GUI session
GUI_LOG=/persist/logs/gui-session.log
