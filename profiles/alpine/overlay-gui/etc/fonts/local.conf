<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CoLinux Lite GUI — font rendering defaults

  Activates slight hinting + RGB subpixel rendering and uses the embedded
  bitmaps for CJK / monospace fonts where available.  This noticeably
  improves text clarity on the mix of panels a CoLinux device boots on,
  from old 1080p monitors to Retina-class tablet touchscreens.

  The file is installed at /etc/fonts/local.conf (the system-level default
  that is always merged).  Users can override per-app via ~/.config/fontconfig.
-->
<fontconfig>

  <!-- Default rendering: slight hinting, RGB subpixel, embedded bitmaps on -->
  <match target="pattern">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Prefer DejaVu as the sans-serif / serif / monospace fallback -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

</fontconfig>
