# CoLinux Lite GUI — foot terminal configuration (system default)
#
# foot searches for its config in this order:
#   1. $XDG_CONFIG_HOME/foot/foot.ini   (default: ~/.config/foot/foot.ini)
#   2. $XDG_CONFIG_DIRS/foot/foot.ini   (default: /etc/xdg/foot/foot.ini)
#
# This file is the system-wide default (location 2).  It is only used when
# the codex user has no personal ~/.config/foot/foot.ini.  A per-device
# override can be dropped at /persist/config/foot.ini — codex-shell-gui
# copies it to ~/.config/foot/foot.ini at session start so it survives
# reboots and wins over this default.
#
# Rendering notes:
#   - font=monospace picks up the system monospace preference (DejaVu Sans
#     Mono on Alpine via /etc/fonts/local.conf), so we get a real font
#     out-of-the-box without naming a TTF that may not be installed.
#   - dpi-aware=yes makes foot honour the panel DPI even when the
#     compositor runs at scale 1.  This is the key setting for crisp text
#     on high-density panels (Retina-class Pi touchscreens, 4K tablets).
#   - On HiDPI panels the compositor scale (set by codex-display) upscales
#     the entire surface; with dpi-aware=yes the logical font size stays
#     correct without enlarging the config size.
#   - bold-text-in-bright=no keeps bold at the same colour for readability
#     in the Codex CLI TUI.
#   - workers=4 spawns rendering threads — speeds up scrolling on multi-core.

[main]
font=monospace:size=11
dpi-aware=yes
bold-text-in-bright=no
workers=4

[bell]
urgent=no
notify=no

[key-bindings]
# scrollback
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-half-page=Control+Shift+Up
scrollback-down-half-page=Control+Shift+Down
# clipboard
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
# search
search-start=Control+Shift+r

[mouse-bindings]
select-begin=BTN_LEFT
select-begin-block=BTN_RIGHT
paste=BTN_MIDDLE

[colors]
alpha=1.0
background=1a1b26
foreground=c0caf5

# Normal colours
regular0=15161e   # black
regular1=f7768e   # red
regular2=9ece6a   # green
regular3=e0af68   # yellow
regular4=7aa2f7   # blue
regular5=bb9af7   # magenta
regular6=7dcfff   # cyan
regular7=a9b1d6   # white

# Bright colours
bright0=414868    # bright black
bright1=f7768e    # bright red
bright2=9ece6a    # bright green
bright3=e0af68    # bright yellow
bright4=7aa2f7    # bright blue
bright5=bb9af7    # bright magenta
bright6=7dcfff    # bright cyan
bright7=c0caf5    # bright white
